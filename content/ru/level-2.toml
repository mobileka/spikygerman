[[section.question]]
id = "q09"
type = "gaps"
ask = "Ich ___ (arbeiten) in Berlin."
instruction = "Выберите правильную форму глагола arbeiten."
explanation = "После «я» (ich) у глагола arbeiten окончание -e: ich arbeite."
translation = "Я работаю в Берлине."
answers = ["arbeite"]
gap_choices = ["arbeite|arbeitest|arbeitet|arbeiten"]

[[section.question]]
id = "q10"
type = "gaps"
ask = "Du ___ (kaufen) Brot."
instruction = "Выберите правильную форму глагола kaufen."
explanation = "После «ты» (du) у глагола kaufen окончание -st: du kaufst."
translation = "Ты покупаешь хлеб."
answers = ["kaufst"]
gap_choices = ["kaufe|kaufst|kauft|kaufen"]

[[section.question]]
id = "q11"
type = "gaps"
ask = "Er ___ (spielen) Fußball."
instruction = "Выберите правильную форму глагола spielen."
explanation = "После «он» (er) у глагола spielen окончание -t: er spielt."
translation = "Он играет в футбол."
answers = ["spielt"]
gap_choices = ["spiele|spielst|spielt|spielen"]

[[section.question]]
id = "q12"
type = "gaps"
ask = "Wir ___ (machen) Frühstück."
instruction = "Выберите правильную форму глагола machen."
explanation = "После «мы» (wir) глагол стоит в основной форме: wir machen."
translation = "Мы готовим завтрак."
answers = ["machen"]
gap_choices = ["mache|machst|macht|machen"]

[[section.question]]
id = "q13"
type = "sentence"
ask = "Sie lernt Deutsch. Schreiben Sie die Frage."
instruction = "Сделайте из утверждения вопрос: глагол стоит на первом месте."
explanation = "В вопросе без вопросительного слова глагол стоит на первом месте: «Lernt sie Deutsch?»"
starts_with = "Lernt sie"

[[section.question]]
id = "q14"
type = "sentence"
ask = "Du kaufst Milch. Schreiben Sie die Frage."
instruction = "Сделайте из утверждения вопрос: глагол стоит на первом месте."
explanation = "Глагол на первом месте: «Kaufst du Milch?» Так утверждение превращается в вопрос."
starts_with = "Kaufst du"

[[section.question]]
id = "q15"
type = "yesno"
ask = "Trinkst du Kaffee?"
instruction = "Ответьте за себя полным предложением. Возможны оба ответа."
explanation = "Ответ «да»: «Ja, ich trinke Kaffee». Ответ «нет»: «Nein, ich trinke keinen Kaffee».\nСлово Kaffee мужского рода, поэтому в отрицании keinen."
translation = "Да, я пью кофе."
answer = "Ja, ich trinke Kaffee."
answers = ["Ja, ich trinke Kaffee.", "Nein, ich trinke keinen Kaffee."]

[[section.question]]
id = "q16"
type = "gaps"
ask = "Er ___ (trinken) Tee."
instruction = "Выберите правильную форму глагола trinken."
explanation = "После «он» (er) у глагола trinken окончание -t: er trinkt."
translation = "Он пьёт чай."
answers = ["trinkt"]
gap_choices = ["trinke|trinkst|trinkt|trinken"]


# ── Abschnitt 3: Supermarkt ─────────────────────────────────────────────────

[[section]]
id = "supermarkt"
title = "Im Supermarkt"
instruction = "Вы в супермаркете. Впишите артикль или количество и напишите цену словами."
table = "markt"
example = "ein Kilo Tomaten, ein Kilo Äpfel\n\nIch kaufe einen Apfel.\nIch brauche einen Joghurt."

[[section.question]]
id = "q17"
type = "gaps"
ask = "Ich kaufe ___ Kilo Tomaten und ___ Flasche Wasser."
