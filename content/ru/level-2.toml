[[section.question]]
id = "q20"
type = "gaps"
ask = "Es ___ hier keinen Käse."
instruction = "Выберите правильную форму глагола geben."
explanation = "Оборот es gibt переводится «есть, имеется».\n«Es gibt keinen Käse» — «Сыра нет»."
translation = "Здесь нет сыра."
answers = ["gibt"]
gap_choices = ["gebe|gibst|gibt|geben"]

[[section.question]]
id = "q21"
type = "yesno"
ask = "Ist das ein Apfel?"
instruction = "Посмотрите на фотографию и ответьте полным предложением."
explanation = "На фотографии помидор, а не яблоко: «Das ist kein Apfel» (слово Apfel мужского рода).\nПравильно: «Das ist eine Tomate» — слово Tomate женского рода."
translation = "Нет, это не яблоко. Это помидор."
answer = "Nein, das ist kein Apfel. Das ist eine Tomate."
photo = "img/food-tomate.webp"
alt = "Фотография: помидор."
sr_data = "На фотографии помидор: красный, круглый, с зелёной плодоножкой. Это не яблоко."

[[section.question]]
id = "q22"
type = "price"
ask = "Wie viel kostet der Käse?"
instruction = "Напишите цену словами."
explanation = "Слово Käse стоит в единственном числе, поэтому kostet: «Der Käse kostet …».\nЦена словами: drei Euro neunundvierzig Cent."
translation = "Сыр стоит 3,49 €."
answer = "Der Käse kostet drei Euro neunundvierzig Cent."

[[section.question]]
id = "q23"
type = "price"
ask = "Wie viel kosten die Tomaten?"
instruction = "Напишите цену словами."
explanation = "Слово Tomaten стоит во множественном числе, поэтому kosten: «Die Tomaten kosten …».\nЦена словами: ein Euro neunundneunzig Cent."
translation = "Помидоры стоят 1,99 €."
answer = "Die Tomaten kosten ein Euro neunundneunzig Cent."

[[section.question]]
id = "q24"
