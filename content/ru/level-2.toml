# ============================================================================
# SpikyGerman — Уровень 2: Familie und Einkaufen (für den Lehrer)
# ============================================================================
#
# Eine Datei = ein Уровень in einer Sprache. Aufbau wie in level-1.toml:
#   [level]              = der Уровень (id, number, title)
#   [[section]]          = ein Abschnitt mit instruction auf Russisch
#   [[section.question]] = eine Frage mit ask (deutsch), explanation und
#                          translation (russisch) und der Lösung
#   [table.*]            = Preistabelle
#
# Diese Datei ist russisch. Die deutschen Aufgaben und Antworten müssen in
# allen Sprachen gleich sein — „bun run check“ vergleicht sie.
#
# Antworten mit mehreren richtigen Varianten (z. B. Ja/Nein-Fragen):
#   answer  = "Ja, Anna ist seine Schwester."      # Musterlösung
#   answers = ["Ja, Anna ist seine Schwester.",   # erste = answer
#              "Ja, sie ist seine Schwester."]
#
# Пояснения (explanation) пишем обычными понятными предложениями, без стрелок
# и сокращений: ученик читает их один раз и после ошибки.
#
# Die fünf Konzepte: Verbkonjugation, Akkusativ, Bitten (Gib mir / Geben Sie
# mir), Ja/Nein-Fragen, Possessivpronomen.
#
# Nach jeder Änderung:  bun run check
# ============================================================================


[level]
id = "level-2"
number = 2
title = "Familie und Einkaufen"


# ── Abschnitt 1: Familie ────────────────────────────────────────────────────

[[section]]
id = "familie"
title = "Meine Familie"
instruction = "Посмотрите на слова в примере и напишите о своей семье. Помните: Ich habe einen … / eine … / zwei …"
example = "der Vater, die Mutter, die Eltern, das Kind, die Kinder\nder Sohn, die Tochter, der Bruder, die Schwester\n\nIch habe eine Tochter und zwei Söhne.\nDas ist mein Bruder. Das ist meine Schwester."

[[section.question]]
id = "q01"
type = "choice"
ask = "Das ist ___ Vater."
instruction = "Выберите правильный определённый артикль."
explanation = "Слово Vater мужского рода, поэтому говорим der Vater."
translation = "Это отец."
options = ["der", "die", "das"]
answer = "der"

[[section.question]]
id = "q02"
type = "gaps"
ask = "Ich habe ___ Tochter und zwei ___."
instruction = "Впишите артикль и слово во множественном числе."
explanation = "Слово Tochter женского рода, поэтому eine Tochter.\nВо множественном числе артикль не нужен: zwei Söhne."
translation = "У меня есть дочь и два сына."
answers = ["eine", "Söhne"]

[[section.question]]
id = "q03"
type = "gaps"
ask = "Meine Schwester ___ (heißen) Anna."
instruction = "Выберите правильную форму глагола heißen."
explanation = "После «она» (sie) у глагола heißen окончание -t: sie heißt."
translation = "Мою сестру зовут Анна."
answers = ["heißt"]
gap_choices = ["heiße|heißt|heißen"]

[[section.question]]
id = "q04"
type = "gaps"
ask = "Das ist ___ Bruder. Das ist ___ Mutter."
instruction = "Впишите mein или meine."
explanation = "Слово Bruder мужского рода, поэтому mein Bruder.\nСлово Mutter женского рода, поэтому meine Mutter."
translation = "Это мой брат. Это моя мама."
answers = ["mein", "meine"]

[[section.question]]
id = "q05"
type = "translate"
ask = "У меня есть жена и сын."
instruction = "Переведите на немецкий."
explanation = "Слово Frau женского рода: eine Frau.\nСлово Sohn мужского рода; в винительном падеже (Akkusativ) артикль становится einen: einen Sohn."
frame = "ich habe"
answer_keywords = ["Frau", "einen", "Sohn"]
answer = "Ich habe eine Frau und einen Sohn."

[[section.question]]
id = "q06"
type = "yesno"
ask = "Tom hat eine Schwester. Sie heißt Anna. Ist Anna seine Schwester?"
instruction = "Ответьте полным предложением."
explanation = "«Его сестра» — это seine Schwester: слово Schwester женского рода.\nВместо имени можно сказать sie: «Ja, sie ist seine Schwester»."
translation = "Да, Анна — его сестра."
answer = "Ja, Anna ist seine Schwester."
answers = ["Ja, Anna ist seine Schwester.", "Ja, sie ist seine Schwester."]

[[section.question]]
id = "q07"
type = "sentence"
ask = "Erzählen Sie von Ihrer Familie."
instruction = "Напишите два предложения о своей семье. Начните с «Ich habe …»."
explanation = "Подойдёт любой вариант: «Ich habe einen Sohn», «Ich habe eine Tochter», «Ich habe zwei Kinder»."
starts_with = "Ich habe"

[[section.question]]
id = "q08"
type = "gaps"
ask = "Das ist Petro. ___ Frau heißt Olena. Das ist Anna. ___ Mann heißt Tom."
instruction = "Впишите sein или ihr."
explanation = "Пётр — мужчина, о нём говорим seine Frau («его жена»).\nАнна — женщина, о ней говорим ihr Mann («её муж»)."
translation = "Это Петро. Его жену зовут Олена. Это Анна. Её мужа зовут Том."
answers = ["Seine", "Ihr"]


# ── Abschnitt 2: Verben und Fragen ──────────────────────────────────────────

[[section]]
id = "verben-fragen"
title = "Verben und Fragen"
instruction = "Впишите правильную форму глагола. Из утверждения сделайте вопрос: глагол стоит на первом месте."
