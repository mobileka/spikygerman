explanation = "Оборот es gibt значит «есть, имеется»: «Es gibt Brot».\nСлово Milch женского рода, поэтому в отрицании keine Milch."
frame = "es gibt"
answer_keywords = ["Brot", "keine", "Milch"]
answer = "Es gibt Brot, aber es gibt keine Milch."


# ── Abschnitt 4: Bitten und Wünsche ─────────────────────────────────────────

[[section]]
id = "bitten"
title = "Bitten und Wünsche"
instruction = "Попросите вежливо. С «du» — Gib/Nimm, с «Sie» — Geben Sie/Nehmen Sie."
example = "du: Gib mir bitte das Brot.\ndu: Nimm deine Tasche!\n\nSie: Geben Sie mir bitte die Milch.\nSie: Nehmen Sie das Buch."

