# ============================================================================
# Русские тексты интерфейса.
# ============================================================================
#
# Один язык = одна папка: content/ru/. Украинская версия — это content/uk/,
# немецкий тест менять не нужно.
#
# [ui] — кнопки и подписи в интерфейсе.
# Задания к разделам лежат в content/ru/level-N.toml.
#
# Подстановки в фигурных скобках: {expected}, {name}, {aus}, {keywords},
# {n}, {correct}, {total}, {answered}, {language} — их заполняет приложение.

# [language] — как язык называется сам по себе. Отсюда приложение собирает
# список языков в настройках, поэтому новая папка content/<код>/ с этим
# блоком появляется в переключателе сама.
[language]
name = "Русский"

[ui]
