# ============================================================================
# SpikyGerman — Уровень 1 (для учителя)
# ============================================================================
#
# Eine Datei = ein Уровень in einer Sprache. Hier steht alles zusammen:
# die deutschen Aufgaben und die russischen Texte. Du kannst sie in Zed
# öffnen und ändern.
#
# Diese Datei ist russisch. Eine ukrainische Version wäre
# content/uk/level-1.toml: die deutschen Aufgaben bleiben gleich, nur die
# Texte in der Landessprache werden übersetzt. „bun run check“ prüft, dass
# die Antworten in allen Sprachen gleich sind.
#
# So ist die Datei aufgebaut:
#   [level]              = der Уровень selbst
#   [[section]]          = ein Abschnitt (z. B. „Dialoge“)
#   [[section.question]] = eine Frage in diesem Abschnitt
#
# Der Уровень hat:
#   id     = kurzer Name, z. B. "sample-test-1"
#   number = die Nummer des Уровня (1, 2, …) — in allen Sprachen gleich
#   title  = Name auf Deutsch
#
# Ein Abschnitt hat:
#   id          = kurzer Name, z. B. "dialoge"
#   title       = Überschrift auf Deutsch
#   instruction = Aufgabe in der Sprache der Datei (hier Russisch)
#   example     = Beispiel, das immer sichtbar ist (freiwillig)
#   example_photo / example_alt = Bild zum Beispiel (freiwillig)
#   photo / alt / sr_data / table = Bild und Text für die ganze Aufgabe
#
# Jede Frage hat:
#   type        = die Art der Aufgabe (siehe Liste unten)
#   ask         = die Aufgabe auf Deutsch (bei „translate“: der Satz in der
#                 Sprache der Datei, der übersetzt werden soll)
#   explanation = kurze Erklärung in der Sprache der Datei (nach dem Prüfen)
#   answer      = die Lösung (je nach type)
#   example     = nur wenn die Frage eine eigene Aufgabe hat (z. B. Übersetzen);
#                 Beispiele stehen sonst oben im Abschnitt, nicht in der Frage.
#
# ----------------------------------------------------------------------------
# Die sieben Aufgabentypen mit Beispiel
# ----------------------------------------------------------------------------
#
# 1) type = "sentence" — der Lernende schreibt einen ganzen Satz.
#    Du prüfst den Satzanfang, der Rest ist frei.
#
#      starts_with = "Ich heiße"        # so muss der Satz anfangen
#      ends_with   = "Jahre alt"        # nur wenn nötig
#      country     = true               # nur bei „Ich komme aus …“
#
#    „country = true“ bedeutet: Der App schaut in content/ru/countries.toml nach
#    (pro Sprache eine eigene Liste).
#    Schreibt jemand „Ich komme aus Ukraine“, kommt ein gelber Hinweis:
#    „Почти! die Ukraine → aus der Ukraine.“
#
# 2) type = "gaps" — Lücken im Satz.
#    Schreibe ___ (drei Unterstriche) für das GANZE fehlende Wort.
#    answers löst die Lücken der Reihe nach auf. Mehrere Varianten gehen auch:
#    dann schreibe eine kleine Liste. Die erste Variante ist die Musterlösung.
#
#      answers = [["kommen", "kommst"], ["Sie", "du"], "aus"]
#
#    Für Formen (z. B. Konjugation) kannst du gap_choices ergänzen: eine
#    Zeile pro Lücke. Leere Zeile ("") = der Lernende schreibt selbst.
#    Sonst werden die mit | getrennten Wörter als Auswahl angezeigt; die
#    richtige Antwort (jede Variante) muss dabei sein.
#
#      ask = "Herr Meier, woher ___ ___?\nIch komme ___ Deutschland."
#      answers = [["kommen", "kommst"], ["Sie", "du"], "aus"]
#      gap_choices = ["kommen|kommst|komme", "", ""]
#
# 3) type = "person" — über eine Person schreiben (er / sie / sie-Plural).
#    Der Lernende wählt das Pronomen und füllt die Felder:
#    name, from, residence, city, street.
#    Das Verb (kommt/kommen, wohnt/wohnen) ergibt sich aus dem Pronomen.
#
# 4) type = "choice" — Auswahl (Radio-Knöpfe).
#
#      options = ["der", "die", "das"]
#      answer  = "der"
#
# 5) type = "yesno" — Antwort mit „Ja …“ oder „Nein …“ als ganzer Satz.
#    Groß/klein, Kommas und Punkte sind egal. Endungen sind wichtig.
#
#      answer = "Ja, das ist eine Tomate."
#
# 6) type = "price" — ganzer Satz mit Preis, die Zahl in Worten.
#    „ein Euro und elf Cent“ und „ein Euro elf Cent“ sind beide richtig.
#
#      answer = "Der Käse kostet sechsundsechzig Cent."
#
# 7) type = "translate" — Übersetzung Russisch → Deutsch.
#    Geprüft wird: die Konstruktion (frame) und alle Stichwörter.
#    Die Reihenfolge der Wörter ist frei.
#
#      frame           = "wir brauchen"
#      answer_keywords = ["Paprika", "Eier", "Fisch"]
#      answer          = "Wir brauchen Paprika, Eier und Fisch."   # Musterlösung
#
# ----------------------------------------------------------------------------
# Bilder
# ----------------------------------------------------------------------------
#
#   photo   = "img/tomate.webp"   # Datei in public/img/
#   alt     = "Одна фраза для тех, у кого картинка не загрузилась."
#   sr_data = "Что слышит незрячий ученик вместо картинки. Пиши так, чтобы
#              по описанию можно было ответить на вопросы: что видно,
#              сколько предметов, какого цвета, чего нет."
#
# Bilder für eine ganze Aufgabe stehen am Abschnitt (z. B. der Kühlschrank),
# Bilder für eine einzelne Frage stehen an der Frage (z. B. das Foto).
# photo + alt + sr_data stehen immer zusammen, damit sie nicht auseinander
# laufen. Bei sr_data lieber einen Satz zu viel als zu wenig: der Text ist
# die Augen der nicht sehenden Lernenden. Für die Preistabelle genügt
# table = "rewe": die Tabelle liest nur der Screenreader, die anderen sehen
# das Flyer-Bild.
#
# ----------------------------------------------------------------------------
# Erklärungen
# ----------------------------------------------------------------------------
#
# Jede Frage hat direkt unter „ask“ eine explanation in der Sprache der Datei:
#
#   ask = "Herr Meier, woher ___ ___?"
#   explanation = "du → -st; формальное Sie → -en"
#
# Diese Erklärung sieht der Lernende nach dem Prüfen. Fehlt sie, meldet
# „bun run check“ eine Warnung.
#
# ----------------------------------------------------------------------------
# Prüfen
# ----------------------------------------------------------------------------
#
# Nach jeder Änderung:  bun run check
# Die Prüfung spricht klar: „q22: … did you mean one of der/die/das?“
# Sie vergleicht auch alle Sprachen: gleiche Fragen, gleiche Antworten darin.
#
# ============================================================================


[level]
id = "sample-test-1"
number = 1
title = "Test 1"


# ── Abschnitt 1 ─────────────────────────────────────────────────────────────

[[section]]
id = "sich-vorstellen"
title = "Sich vorstellen"
instruction = "Ответьте на вопросы полными предложениями, как в примере."
example = "Wie heißen Sie? — Ich heiße Anna.\nWoher kommen Sie? — Ich komme aus Syrien.\nWo wohnen Sie? — Ich wohne in Berlin.\nWas sprechen Sie? — Ich spreche Russisch.\nWie alt sind Sie? — Ich bin 30 Jahre alt."

[[section.question]]
id = "q01"
type = "sentence"
ask = "Wie heißen Sie?"
explanation = "Ответьте полным предложением: Ich heiße + имя."
starts_with = "Ich heiße"

[[section.question]]
id = "q02"
type = "sentence"
ask = "Woher kommen Sie?"
explanation = "die Ukraine — женский род: aus der Ukraine."
starts_with = "Ich komme aus"
country = true

[[section.question]]
id = "q03"
type = "sentence"
ask = "Wo wohnen Sie?"
explanation = "Ich wohne in … — где вы живёте."
starts_with = "Ich wohne in"

[[section.question]]
id = "q04"
type = "sentence"
ask = "Was sprechen Sie?"
explanation = "Ich spreche … — на каком языке вы говорите."
starts_with = "Ich spreche"

[[section.question]]
id = "q05"
type = "sentence"
ask = "Wie alt sind Sie?"
explanation = "Не забудьте: Ich bin … Jahre alt."
starts_with = "Ich bin"
ends_with = "Jahre alt"


# ── Abschnitt 2 ─────────────────────────────────────────────────────────────

[[section]]
id = "dialoge"
title = "Dialoge"
instruction = "Заполните пропуски в диалогах. Там, где нужно, выберите правильную форму глагола из списка."
example = "Herr Ali, woher kommst du?\nIch komme aus Syrien."

[[section.question]]
id = "q06"
type = "gaps"
ask = "Herr Meier, woher ___ ___?\nIch komme ___ Deutschland."
explanation = "Вежливо (Sie): kommen Sie. С «du» тоже правильно: kommst du."
answers = [["kommen", "kommst"], ["Sie", "du"], "aus"]
gap_choices = ["kommen|kommst|komme", "", ""]

[[section.question]]
id = "q07"
type = "gaps"
ask = "Petro, woher ___ du?\nIch ___ aus ___ Ukraine."
explanation = "du → форма на -st: kommst. die Ukraine — женский род, поэтому aus der Ukraine."
answers = ["kommst", "komme", "der"]
gap_choices = ["kommen|kommst|komme", "kommen|kommst|komme", ""]

[[section.question]]
id = "q08"
type = "gaps"
ask = "Frau Saccon, woher ___ ___?\nAus Italien."
explanation = "Вежливо: kommen Sie. Разговорно: kommst du."
answers = [["kommen", "kommst"], ["Sie", "du"]]
gap_choices = ["kommen|kommst|komme", ""]


# ── Abschnitt 3 ─────────────────────────────────────────────────────────────

[[section]]
id = "einkaufen"
title = "Einkaufen"
instruction = "Помогите Сандре и Тому составить список покупок. Посмотрите на холодильник и ответьте на вопросы полными предложениями."
photo = "img/fridge.webp"
alt = "Рисунок: холодильник с продуктами."
sr_data = "На рисунке холодильник. В холодильнике лежат бананы и помидоры. Яиц в холодильнике нет. Перца (Paprika) в холодильнике тоже нет."
example = "Haben wir Milch?\nJa, wir haben Milch. / Nein, wir haben keine Milch."

[[section.question]]
id = "q13"
type = "yesno"
ask = "Haben wir Bananen?"
explanation = "Бананы есть: Ja, wir haben Bananen."
answer = "Ja, wir haben Bananen."

[[section.question]]
id = "q14"
type = "yesno"
ask = "Haben wir Eier?"
explanation = "Eier — множественное число: keine Eier."
answer = "Nein, wir haben keine Eier."

[[section.question]]
id = "q15"
type = "yesno"
ask = "Haben wir Paprika?"
explanation = "Paprika — без артикля: keine Paprika."
answer = "Nein, wir haben keine Paprika."

[[section.question]]
id = "q16"
type = "yesno"
ask = "Haben wir Tomaten?"
explanation = "Помидоры есть: Ja, wir haben Tomaten."
answer = "Ja, wir haben Tomaten."

[[section.question]]
id = "q17"
type = "translate"
ask = "Нам нужны перец, яйца и рыба."
explanation = "Paprika и Fisch — без артикля. Eier — множественное число, тоже без артикля."
instruction = "Переведите на немецкий."
frame = "wir brauchen"
answer_keywords = ["Paprika", "Eier", "Fisch"]
answer = "Wir brauchen Paprika, Eier und Fisch."
example = "Нам нужен сыр. → Wir brauchen Käse."


# ── Abschnitt 4 ─────────────────────────────────────────────────────────────

[[section]]
id = "was-ist-das"
title = "Was ist das?"
instruction = "Посмотрите на фотографию и ответьте полным предложением. Если предмет назван правильно, напишите: «Ja, das ist ein/eine …». Если неправильно, напишите: «Nein, das ist kein/keine …» и укажите, что это на самом деле."
example = "Ist das eine Birne? — Ja, das ist eine Birne.\nIst das ein Apfel? — Nein, das ist kein Apfel. Das ist eine Birne."

[[section.question]]
id = "q18"
type = "yesno"
ask = "Ist das eine Tomate?"
explanation = "eine Tomate — женский род."
answer = "Ja, das ist eine Tomate."
photo = "img/food-tomate.webp"
alt = "Фотография: помидор."
sr_data = "На фотографии помидор: красный, круглый, с зелёной плодоножкой."

[[section.question]]
id = "q19"
type = "yesno"
ask = "Ist das ein Brötchen?"
explanation = "kein Brötchen (das), ein Fisch (der)."
answer = "Nein, das ist kein Brötchen. Das ist ein Fisch."
photo = "img/food-fisch.webp"
alt = "Фотография: рыба."
sr_data = "На фотографии рыба на тарелке. Это не хлеб и не булочка."

[[section.question]]
id = "q20"
type = "yesno"
ask = "Ist das ein Kuchen?"
explanation = "ein Kuchen — мужской род."
answer = "Ja, das ist ein Kuchen."
photo = "img/food-kuchen.webp"
alt = "Фотография: пирог."
sr_data = "На фотографии пирог (Kuchen) — сладкая выпечка."

[[section.question]]
id = "q21"
type = "yesno"
ask = "Ist das eine Banane?"
explanation = "keine Banane (женский род), eine Paprika (женский род)."
answer = "Nein, das ist keine Banane. Das ist eine Paprika."
photo = "img/food-paprika.webp"
alt = "Фотография: красный перец."
sr_data = "На фотографии красный болгарский перец. Это не банан."


# ── Abschnitt 5 ─────────────────────────────────────────────────────────────

[[section]]
id = "preise"
title = "Preise"
instruction = "Посмотрите на рекламный проспект и ответьте полными предложениями, сколько что стоит. Цены напишите словами."
photo = "img/rewe.webp"
alt = "Фотография: рекламный проспект REWE с ценами."
table = "rewe"
example = "Wie viel kosten die Pringles? — Die Pringles kosten ein Euro vierunddreißig Cent.\nWie viel kostet der Wirsing? — Der Wirsing kostet fünfundsiebzig Cent."

[[section.question]]
id = "q22"
type = "price"
ask = "Wie viel kosten Tomaten?"
explanation = "kosten — для множественного числа: Die Tomaten kosten. Прописью: ein Euro elf Cent."
answer = "Die Tomaten kosten ein Euro elf Cent."

[[section.question]]
id = "q23"
type = "price"
ask = "Wie viel kostet der Käse?"
explanation = "kostet — для единственного числа: Der Käse kostet. Прописью: sechsundsechzig Cent."
answer = "Der Käse kostet sechsundsechzig Cent."

[[section.question]]
id = "q24"
type = "price"
ask = "Wie viel kostet der Joghurt?"
explanation = "kostet — единственное число: Der Joghurt kostet. Прописью: achtundzwanzig Cent."
answer = "Der Joghurt kostet achtundzwanzig Cent."

[[section.question]]
id = "q25"
type = "price"
ask = "Wie viel kostet der Kaffee?"
explanation = "kostet — единственное число: Der Kaffee kostet. Прописью: drei Euro zweiundvierzig Cent."
answer = "Der Kaffee kostet drei Euro zweiundvierzig Cent."


# ── Abschnitt 6 ─────────────────────────────────────────────────────────────

[[section]]
id = "artikel-und-verben"
title = "Artikel und Verben"
instruction = "Заполните пропуски или выберите правильный вариант. Слова пишите полностью."
example = "Ich möchte eine Orange. Ich habe keine Orange.\nHunger (haben) → Ich habe Hunger."

[[section.question]]
id = "q26"
type = "choice"
ask = "___ Käse ist gelb."
explanation = "der Käse — мужской род."
