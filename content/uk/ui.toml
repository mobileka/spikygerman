# ============================================================================
# Українські тексти інтерфейсу.
# ============================================================================
#
# Одна мова = одна папка: content/uk/. Російська версія — це content/ru/,
# німецький тест змінювати не потрібно.
#
# [ui] — кнопки та підписи в інтерфейсі.
# Завдання до розділів лежать у content/uk/level-N.toml.
#
# Підстановки у фігурних дужках: {expected}, {name}, {aus}, {keywords},
# {n}, {correct}, {total}, {answered}, {language} — їх заповнює застосунок.

# [language] — як мова називається сама собою. Звідси застосунок збирає
# список мов у налаштуваннях, тому нова папка content/<код>/ із цим блоком
# з'являється в перемикачі автоматично.
[language]
name = "Українська"

[ui]
# Оболонка застосунку: шапка, нижня навігація, пропуск до вмісту.
