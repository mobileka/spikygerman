<script>
/* theme boot — must stay inline in <head> so the first paint has no flash */
(function(){try{var t=localStorage.getItem("spiky-theme");if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>

<!-- Design system, in load order.

     This template becomes a new screen at the repository root, but it also renders
     correctly where it sits inside the package, so the path to the system files
     depends on where the file ends up:

       · copied to the repository root      →  src/styles/tokens/tokens.css
       · previewed inside src/styles/        →  tokens/tokens.css

     Both are resolved below before a single stylesheet is requested. Once a screen
     has settled at the root, the "src/styles/…" form can be hard-coded. -->
<script>
(function () {
  /* Which directory is this page actually served from? Not always the folder the file
     sits in, so the prefix follows the live URL: if the address already contains
     "src/styles/", the system folders are siblings and need no prefix; otherwise
     the page is being served from the repository root and reaches into the package. */
  var servedFromPackage = decodeURIComponent(location.href).indexOf("src/styles/") > -1;
  var prefix = servedFromPackage ? "" : "src/styles/";
  var layers = [
    "tokens/tokens.css",
    "tokens/legacy-bridge.css",
    "tokens/od-layout-primitives.css",
    "components/components.css",
    "components/design-stage.css",
    "components/modules.css"
  ];
  for (var i = 0; i < layers.length; i++) {
    document.write('<link rel="stylesheet" href="' + prefix + layers[i] + '">');
  }
  // The screen links below are authored for the repository root, where they point
  // at sibling screens. Previewed where it sits, they are re-based so the mock and
  // its tab bar stay navigable.
  if (servedFromPackage) {
    document.addEventListener("DOMContentLoaded", function () {
      var links = document.querySelectorAll('a[href$=".html"]');
      for (var j = 0; j < links.length; j++) {
        links[j].setAttribute("href", "../" + links[j].getAttribute("href"));
      }
    });
  }
})();
</script>
